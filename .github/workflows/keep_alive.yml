name: Supabase Project Keep-Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (100% Free GitHub Actions cron)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to prevent free tier pause..."
          curl -s -f -X GET "${SUPABASE_URL}/rest/v1/daily_prompts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null
          echo "Ping successful! Supabase project remains active."
